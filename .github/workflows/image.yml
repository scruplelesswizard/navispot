# Builds the container image for my home cluster and pushes it to GHCR.
# Upstream publishes no image. This fork is public, so it uses GitHub-hosted
# runners (the cluster's own runners are for private repos only).
name: Image

on:
  push:
    branches: [main, ci/ghcr-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/scruplelesswizard/navispot:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/scruplelesswizard/navispot
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
